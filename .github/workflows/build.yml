      # VSCodium's preinstall.ts can't find Visual Studio ("Invalid C/C++ Compiler
      # Toolchain"). Locate VS with vswhere and set vs2022_install explicitly.
      - name: Point the build at Visual Studio (vs2022_install)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { Write-Error "No Visual Studio install found via vswhere"; exit 1 }
          "vs2022_install=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "vs2022_install=$vs"
      # node-gyp discovers Visual Studio itself, separately from vs2022_install
      # above, and the copy bundled with npm for Node 22 is 11.2.0. That version
      # does not understand Visual Studio 18 (2026) -- it reports `unknown version
      # "undefined" found at "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise"`
      # and then fails the native rebuild of @vscode/deviceid. The windows-11-arm
      # image moved to VS 18 (the x64 image is still on VS 2022, so only arm64 broke
      # first); VS 2026 support landed in node-gyp 12.1.0 with a follow-up fix in
      # 13.0.1. Pin both Windows jobs to a current node-gyp so neither depends on
      # which VS the runner image happens to ship.
      - name: Use a node-gyp that knows Visual Studio 2026
        shell: bash
        run: |
          set -euo pipefail
          # Replace the copy npm carries, rather than setting npm_config_node_gyp:
          # that config is ignored for a package whose own install script shells out
          # to `node-gyp rebuild` (@vscode/deviceid does), because npm puts its
          # BUNDLED node-gyp on the script's PATH. Tried it, and the build still
          # failed reporting `node-gyp -v v11.2.0`.
          # Staged in a temp dir so the paths stay POSIX -- `npm prefix -g` answers
          # with a backslashed Windows path that Git Bash then mangles.
          mkdir -p /tmp/ng && cd /tmp/ng
          npm init -y >/dev/null
          npm install node-gyp@13 >/dev/null
